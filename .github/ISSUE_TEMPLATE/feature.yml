name: Idee / Änderungswunsch
description: Ein Wunsch, eine Verbesserung oder eine noch vage Idee.
title: "[Idee] "
labels: ["type:feature", "status:inbox"]
body:
  - type: markdown
    attributes:
      value: |
        **Nach dem Anlegen:** `@claude /grill` (Idee schärfen) · `@claude /triage` (bewerten) ·
        `@claude /plan` (planen) · Label `status:approved` (umsetzen lassen) · `@claude /help` (Übersicht)
  - type: textarea
    id: request
    attributes:
      label: Was möchtest du?
      description: |
        Stichpunkte reichen. Hilfreich sind:
        - Problem / Nutzen: für wen ist es nützlich, in welcher Situation?
        - Gewünschtes Verhalten: wie könnte es aussehen? Gern auch grob.
        - Woran erkennt man, dass es fertig ist?
        - Was gehört ausdrücklich nicht dazu?
        Unvollständig ist ok, den Rest klären wir im Dialog.
      placeholder: |
        - Problem / Nutzen: …
        - Gewünschtes Verhalten: …
        - Fertig, wenn: …
        - Nicht dazu: …
    validations:
      required: true
