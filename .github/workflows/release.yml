name: Release container images

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [master]
    paths-ignore:
      - ".github/**"
      - "**/*.md"

concurrency:
  group: homeatlas-release
  cancel-in-progress: false

jobs:
  version:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.pending_tag.outputs.tag || steps.version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - id: pending_tag
        env:
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          pending_tag="$(git tag --list 'homeatlas-pending-v*' --sort=-version:refname | { IFS= read -r tag; printf '%s' "$tag"; })"
          if [ -n "$pending_tag" ]; then
            pending_sha="$(git rev-list -n 1 "$pending_tag")"
            if [ "$pending_sha" != "$TARGET_SHA" ]; then
              echo "Retry the incomplete release for $pending_tag before releasing another commit." >&2
              exit 1
            fi
            printf 'tag=%s\n' "${pending_tag#homeatlas-pending-}" >> "$GITHUB_OUTPUT"
          fi
      - id: version
        if: steps.pending_tag.outputs.tag == ''
        uses: mathieudutour/github-tag-action@d28fa2ccfbd16e871a4bdf35e11b3ad1bd56c0c1 # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          dry_run: true
      - if: steps.pending_tag.outputs.tag == ''
        env:
          RELEASE_TAG: ${{ steps.version.outputs.new_tag }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          test -n "$RELEASE_TAG"
          pending_tag="homeatlas-pending-$RELEASE_TAG"
          git tag "$pending_tag" "$TARGET_SHA"
          git push origin "$pending_tag"

  publish:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: homeatlas-backend
            context: ./backend
            file: ./backend/Dockerfile
          - image: homeatlas-frontend
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - id: build_metadata
        run: printf 'time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
            VITE_BUILD_TIME=${{ steps.build_metadata.outputs.time }}

  tag:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - id: release_version
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: mathieudutour/github-tag-action@d28fa2ccfbd16e871a4bdf35e11b3ad1bd56c0c1 # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.release_version.outputs.version }}
      - env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: git push origin --delete "homeatlas-pending-$RELEASE_TAG"
