name: Release container images

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [master]
    paths-ignore:
      - ".github/**"
      - "**/*.md"

concurrency:
  group: homeatlas-release
  cancel-in-progress: false

jobs:
  version:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.pending_tag.outputs.tag || steps.version.outputs.version_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - id: pending_tag
        env:
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          pending_tag="$(git tag --list 'homeatlas-pending-v*' --sort=-version:refname | { IFS= read -r tag; printf '%s' "$tag"; })"
          if [ -n "$pending_tag" ]; then
            pending_sha="$(git rev-list -n 1 "$pending_tag")"
            if [ "$pending_sha" != "$TARGET_SHA" ]; then
              echo "Retry the incomplete release for $pending_tag before releasing another commit." >&2
              exit 1
            fi
            printf 'tag=%s\n' "${pending_tag#homeatlas-pending-}" >> "$GITHUB_OUTPUT"
          fi
      - id: version
        if: steps.pending_tag.outputs.tag == ''
        uses: PaulHatch/semantic-version@4d6da96a9bc3116da3613309a11ff75fba58eb8d # v6.0.4
        with:
          tag_prefix: v
          search_commit_body: true
      - if: steps.pending_tag.outputs.tag == ''
        env:
          RELEASE_TAG: ${{ steps.version.outputs.version_tag }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          test -n "$RELEASE_TAG"
          pending_tag="homeatlas-pending-$RELEASE_TAG"
          existing_sha="$(git rev-list -n 1 "$pending_tag" 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            test "$existing_sha" = "$TARGET_SHA"
          else
            git tag "$pending_tag" "$TARGET_SHA"
            git push origin "refs/tags/$pending_tag"
          fi

  publish:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: homeatlas-backend
            context: ./backend
            file: ./backend/Dockerfile
          - image: homeatlas-frontend
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - id: build_metadata
        run: printf 'time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
            VITE_BUILD_TIME=${{ steps.build_metadata.outputs.time }}

  tag:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Push release tag
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          test -n "$RELEASE_TAG"
          existing_sha="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            test "$existing_sha" = "$TARGET_SHA"
          else
            git tag "$RELEASE_TAG" "$TARGET_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          git push origin --delete "homeatlas-pending-$RELEASE_TAG"
