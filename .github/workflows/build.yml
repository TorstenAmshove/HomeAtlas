---
name: Build

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine build time
        id: build_metadata
        run: printf 'time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          # Shared with the smoke job below, which builds the same images again with load: true.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
            VITE_BUILD_TIME=${{ steps.build_metadata.outputs.time }}

  # Browser smoke test of the built images (issue #32): `npm run build` only proves the frontend
  # type-checks and bundles, not that it renders. This starts the real backend and frontend images
  # on the host network (as in docker-compose.yml) against a throwaway database and walks a fresh
  # install through login -> MFA -> setup wizard -> app routes in Chromium. It is what lets
  # Renovate auto-merge npm minor updates (renovate.json).
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: homeatlas-backend:smoke
          cache-from: type=gha,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: homeatlas-frontend:smoke
          cache-from: type=gha,scope=frontend
      - name: Start stack
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SMOKE_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          # No Docker socket and no volume: the database and key live in the container and are
          # thrown away with it. Ports are the image defaults (8280 UI, 8281 API on loopback).
          docker run -d --name backend --network host \
            -e ADMIN_PASSWORD="$password" \
            -e HOMEATLAS_DB_PATH=/tmp/smoke.db \
            -e HOMEATLAS_KEY_PATH=/tmp/smoke.key \
            -e HOMEATLAS_OUI_PATH=/tmp/oui.json \
            homeatlas-backend:smoke
          docker run -d --name frontend --network host homeatlas-frontend:smoke
          # Through nginx, so this also proves the /api/ proxy and the uvicorn start.
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:8280/api/health; then exit 0; fi
            sleep 1
          done
          echo "Stack did not become healthy within 60 s" >&2
          exit 1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json
      - name: Install Playwright
        working-directory: frontend/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run smoke test
        working-directory: frontend/e2e
        run: npx playwright test
      - name: Container logs
        if: failure()
        run: |
          docker logs backend || true
          docker logs frontend || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7
