---
name: Test

# Backend lint + test suite. The frontend typecheck (`npm run build` = `tsc -b && vite build`)
# already runs inside the frontend image build in build.yml, so it is not repeated here.

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/test.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Matches the python:3.12-slim base image of backend/Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Test (pytest)
        run: python -m pytest -q
